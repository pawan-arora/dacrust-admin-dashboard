name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_VAR_1: ${{ secrets.VITE_VAR_1 }}
          VITE_VAR_2: ${{ secrets.VITE_VAR_2 }}
          VITE_VAR_3: ${{ secrets.VITE_VAR_3 }}
          VITE_VAR_4: ${{ secrets.VITE_VAR_4 }}
          VITE_VAR_5: ${{ secrets.VITE_VAR_5 }}
          VITE_VAR_6: ${{ secrets.VITE_VAR_6 }}
          VITE_VAR_7: ${{ secrets.VITE_VAR_7 }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DA_CRUST_PROD }}
          projectId: da-crust-prod